name: CI/CD dev backend

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  NODE_VERSION: "20.x"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage threshold
        run: |
          if [ -f "package.json" ] && grep -q "\"test\":" package.json; then
            echo "🧪 Running tests with coverage threshold..."
            
            # Exécuter les tests avec couverture et seuil de réussite
            npm test -- --coverage --coverageThreshold='{"global":{"statements":80,"branches":70,"functions":80,"lines":80}}' --passWithNoTests=false
            
            echo "✅ Tests completed successfully with 80%+ coverage threshold"
          else
            echo "❌ No tests configured in package.json"
            exit 1
          fi

      - name: Verify test success rate
        run: |
          echo "📊 Verifying test success rate..."

          # Exécuter les tests et capturer le résultat
          TEST_OUTPUT=$(npm test -- --silent --passWithNoTests=false 2>&1 || true)

          # Extraire le nombre de tests qui passent et le total
          if echo "$TEST_OUTPUT" | grep -q "Test Suites:"; then
            # Extraire les statistiques des tests
            TOTAL_TESTS=$(echo "$TEST_OUTPUT" | grep "Tests:" | tail -1 | sed 's/.*Tests: *\([0-9]*\) failed, \([0-9]*\) passed.*/\1+\2/' | bc)
            PASSED_TESTS=$(echo "$TEST_OUTPUT" | grep "Tests:" | tail -1 | sed 's/.*Tests: *\([0-9]*\) failed, \([0-9]*\) passed.*/\2/')
            
            if [ -n "$TOTAL_TESTS" ] && [ -n "$PASSED_TESTS" ] && [ "$TOTAL_TESTS" -gt 0 ]; then
              SUCCESS_RATE=$(echo "scale=1; $PASSED_TESTS * 100 / $TOTAL_TESTS" | bc)
              echo "📈 Test Results: $PASSED_TESTS/$TOTAL_TESTS tests passed"
              echo "📊 Success Rate: $SUCCESS_RATE%"
              
              # Vérifier que le taux de réussite est au moins de 80%
              if (( $(echo "$SUCCESS_RATE >= 80" | bc -l) )); then
                echo "✅ Test success rate ($SUCCESS_RATE%) meets the 80% threshold"
              else
                echo "❌ Test success rate ($SUCCESS_RATE%) is below the 80% threshold"
                echo "🚨 CI will fail - tests must pass at least 80% to proceed"
                exit 1
              fi
            else
              echo "⚠️  Could not parse test results"
              exit 1
            fi
          else
            echo "⚠️  No test output found"
            exit 1
          fi

      - name: Generate coverage report
        run: |
          echo "📋 Generating detailed coverage report..."

          # Exécuter les tests avec couverture détaillée
          npm test -- --coverage --coverageReporters=text --coverageReporters=lcov --coverageReporters=html

          echo "📊 Coverage report generated successfully"

          # Afficher un résumé de la couverture
          if [ -f "coverage/lcov-report/index.html" ]; then
            echo "✅ HTML coverage report available in coverage/lcov-report/index.html"
          fi

      - name: Check server startup
        run: |
          timeout 10s npm start || echo "Server startup check completed"

  security:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit (strict)
        run: npm audit --audit-level high

      - name: Check for known vulnerabilities
        run: |
          if [ -f "package-lock.json" ]; then
            npm audit --audit-level high
          else
            echo "No package-lock.json found"
          fi

      - name: CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Check outdated dependencies
        run: |
          npm outdated --depth=0 || echo "Some dependencies are outdated"

  quality:
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: |
          if [ -f "package.json" ] && grep -q "\"lint\":" package.json; then
            npm run lint
          else
            echo "No lint script configured"
          fi

      - name: Check for console.log statements
        run: |
          if grep -r "console.log" . --exclude-dir=node_modules --exclude-dir=.git; then
            echo "⚠️  console.log statements found in code"
          else
            echo "✅ No console.log statements found"
          fi

      - name: Check for hardcoded secrets
        run: |
          # Chercher uniquement les vraies valeurs hardcodées (= "valeur" ou = 'valeur')
          if grep -r -E "(password|secret|key|token)\s*=\s*['\"][^'\"]*['\"]" . \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              --exclude="*.md" \
              --exclude="*.yml" \
              --exclude="*.yaml" \
              --exclude="package*.json" \
              --exclude="*.lock" | \
              grep -v "process.env" | \
              grep -v "req.body" | \
              grep -v "req.params" | \
              grep -v "req.headers" | \
              grep -v "response.cookie" | \
              grep -v "clearCookie"; then
            echo "⚠️  Potential hardcoded secrets found"
            exit 1
          else
            echo "✅ No hardcoded secrets found"
          fi

  database-connection:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check database connection file
        run: |
          if [ -f "db/connect.js" ]; then
            echo "✅ Database connection file found"
            node -c db/connect.js && echo "✅ Database connection file syntax is valid"
          else
            echo "⚠️  Database connection file not found"
          fi

      - name: Check environment variables
        run: |
          if [ -f ".env" ]; then
            echo "✅ .env file found"
          else
            echo "⚠️  .env file not found - consider creating one"
          fi

  api-validation:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check API routes
        run: |
          echo "🔍 Checking API routes:"
          find Routers/ -name "*.js" -exec echo "  - {}" \;

      - name: Check controllers
        run: |
          echo "🎮 Checking controllers:"
          find Controllers/ -name "*.js" -exec echo "  - {}" \;

      - name: Check models
        run: |
          echo "📊 Checking models:"
          find Models/ -name "*.js" -exec echo "  - {}" \;

      - name: Validate server.js
        run: |
          if [ -f "server.js" ]; then
            echo "✅ server.js found"
            node -c server.js && echo "✅ server.js syntax is valid"
          else
            echo "❌ server.js not found"
            exit 1
          fi

  final-validation:
    runs-on: ubuntu-latest
    needs: [test, security, quality, database-connection, api-validation]

    steps:
      - name: All checks passed
        run: |
          echo "✅ All checks passed successfully!"
