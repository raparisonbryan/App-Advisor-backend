name: CI/CD dev backend

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  NODE_VERSION: "20.x"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests (if available)
        run: |
          if [ -f "package.json" ] && grep -q "\"test\":" package.json; then
            npm test
          else
            echo "No tests configured in package.json"
          fi

      - name: Check server startup
        run: |
          timeout 10s npm start || echo "Server startup check completed"

  security:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit (strict)
        run: npm audit --audit-level high

      - name: Check for known vulnerabilities
        run: |
          if [ -f "package-lock.json" ]; then
            npm audit --audit-level high
          else
            echo "No package-lock.json found"
          fi

      - name: CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Check outdated dependencies
        run: |
          npm outdated --depth=0 || echo "Some dependencies are outdated"

  quality:
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: |
          if [ -f "package.json" ] && grep -q "\"lint\":" package.json; then
            npm run lint
          else
            echo "No lint script configured"
          fi

      - name: Check for console.log statements
        run: |
          if grep -r "console.log" . --exclude-dir=node_modules --exclude-dir=.git; then
            echo "⚠️  console.log statements found in code"
          else
            echo "✅ No console.log statements found"
          fi

      - name: Check for hardcoded secrets
        run: |
          # Chercher uniquement les vraies valeurs hardcodées (= "valeur" ou = 'valeur')
          if grep -r -E "(password|secret|key|token)\s*=\s*['\"][^'\"]*['\"]" . \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              --exclude="*.md" \
              --exclude="*.yml" \
              --exclude="*.yaml" \
              --exclude="package*.json" \
              --exclude="*.lock" | \
              grep -v "process.env" | \
              grep -v "req.body" | \
              grep -v "req.params" | \
              grep -v "req.headers" | \
              grep -v "response.cookie" | \
              grep -v "clearCookie"; then
            echo "⚠️  Potential hardcoded secrets found"
            exit 1
          else
            echo "✅ No hardcoded secrets found"
          fi

  database-connection:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check database connection file
        run: |
          if [ -f "db/connect.js" ]; then
            echo "✅ Database connection file found"
            node -c db/connect.js && echo "✅ Database connection file syntax is valid"
          else
            echo "⚠️  Database connection file not found"
          fi

      - name: Check environment variables
        run: |
          if [ -f ".env" ]; then
            echo "✅ .env file found"
          else
            echo "⚠️  .env file not found - consider creating one"
          fi

  api-validation:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check API routes
        run: |
          echo "🔍 Checking API routes:"
          find Routers/ -name "*.js" -exec echo "  - {}" \;

      - name: Check controllers
        run: |
          echo "🎮 Checking controllers:"
          find Controllers/ -name "*.js" -exec echo "  - {}" \;

      - name: Check models
        run: |
          echo "📊 Checking models:"
          find Models/ -name "*.js" -exec echo "  - {}" \;

      - name: Validate server.js
        run: |
          if [ -f "server.js" ]; then
            echo "✅ server.js found"
            node -c server.js && echo "✅ server.js syntax is valid"
          else
            echo "❌ server.js not found"
            exit 1
          fi

  final-validation:
    runs-on: ubuntu-latest
    needs: [test, security, quality, database-connection, api-validation]

    steps:
      - name: All checks passed
        run: |
          echo "✅ All checks passed successfully!"
