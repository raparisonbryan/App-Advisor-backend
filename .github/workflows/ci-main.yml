name: CI/CD Main Branch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20.x"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint || echo "Linting completed with warnings"

      - name: Run tests with coverage threshold
        run: |
          npm test -- --coverage --coverageThreshold='{"global":{"statements":80,"branches":70,"functions":80,"lines":80}}' --passWithNoTests=false --maxWorkers=1 2>&1 | tee test_output.txt

          if grep -q "Coverage threshold" test_output.txt && grep -q "not met" test_output.txt; then
            echo "❌ Coverage threshold not met"
            exit 1
          else
            echo "✅ Coverage threshold met (80%+)"
          fi

  security:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit (strict)
        run: npm audit --audit-level high

      - name: Check for known vulnerabilities
        run: |
          npx audit-ci --config ./audit-ci.json || echo "audit-ci not configured"

      - name: CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Check outdated dependencies
        run: |
          npm outdated --depth=0 || echo "Some dependencies are outdated"

  quality:
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Code complexity check
        run: |
          npx complexity-report --format json . || echo "Complexity report not available"

      - name: Dead code detection
        run: |
          npx unimported || echo "Unimported not found dead code"

      - name: Check for console.log statements
        run: |
          if grep -r "console.log" . --exclude-dir=node_modules --exclude-dir=.git; then
            echo "⚠️  console.log statements found in code"
            exit 1
          else
            echo "✅ No console.log statements found"
          fi

      - name: Check for hardcoded secrets
        run: |
          if grep -r "password\|secret\|key\|token" . --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=tests | grep -v "process.env"; then
            echo "⚠️  Potential hardcoded secrets found"
            exit 1
          else
            echo "✅ No hardcoded secrets found"
          fi

  database-connection:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup MongoDB (memory server)
        run: |
          npm run test:ci &
          sleep 10

      - name: Test database connection
        run: |
          # Test MongoDB connection
          timeout 30s npm start || echo "Database connection test completed"

      - name: Validate database models
        run: |
          # Check if all models are properly defined
          if [ -d "Models" ]; then
            echo "✅ Models directory found"
            ls -la Models/
          else
            echo "⚠️  Models directory not found"
          fi

      - name: Check database configuration
        run: |
          if [ -f "db/connect.js" ]; then
            echo "✅ Database connection file found"
          else
            echo "⚠️  Database connection file not found"
          fi

  api-validation:
    runs-on: ubuntu-latest
    needs: [test, database-connection]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start MongoDB (memory server)
        run: |
          npm run test:ci &
          sleep 10

      - name: Validate API endpoints
        run: |
          # Check if server starts without errors
          timeout 30s npm start || echo "Server startup check completed"

      - name: Check Swagger documentation
        run: |
          if [ -f "swagger.js" ]; then
            echo "✅ Swagger configuration found"
          else
            echo "⚠️  Swagger configuration not found"
          fi

  version-management:
    runs-on: ubuntu-latest
    needs: [test, security, quality, database-connection, api-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Semantic Release
        run: |
          npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  final-validation:
    runs-on: ubuntu-latest
    needs:
      [
        test,
        security,
        quality,
        database-connection,
        api-validation,
        version-management,
      ]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          echo "Checking all previous jobs status..."
          if [[ "${{ needs.test.result }}" == "success" && 
                "${{ needs.security.result }}" == "success" && 
                "${{ needs.quality.result }}" == "success" && 
                "${{ needs.database-connection.result }}" == "success" &&
                "${{ needs.api-validation.result }}" == "success" ]]; then
            echo "✅ All critical jobs passed successfully!"
          else
            echo "❌ Some critical jobs failed. Check the logs above."
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs:
      [
        test,
        security,
        quality,
        database-connection,
        api-validation,
        final-validation,
      ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run final tests
        run: npm test

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production..."
          echo "Production deployment will proceed automatically"
          echo "✅ All checks passed - deployment should proceed automatically"
