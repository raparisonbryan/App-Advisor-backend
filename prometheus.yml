global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Notre backend Node.js
  - job_name: 'appadvisor-backend'
    static_configs:
      - targets: ['app-advisor-backend-production.up.railway.app']
    metrics_path: '/monitoring/metrics'
    scheme: 'https'
    scrape_interval: 30s
    scrape_timeout: 10s
    
    # Configuration TLS pour Railway
    tls_config:
      insecure_skip_verify: true
    
    # Relabeling pour ajouter des labels utiles
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)(?::\d+)?'
        replacement: '${1}'
